<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ETM Affiliate OS</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <header class="topbar">

        <div>

            <h1>ETM Affiliate OS</h1>

            <p>AI Workforce Mission Control</p>

        </div>

        <div class="system-status">

            <span id="system-status">
                🟢 ONLINE
            </span>

        </div>

    </header>

    <main>

        <section class="stats">

            <div class="card stat-card">

                <h3>Revenue Today</h3>

                <h2 id="revenue-today">$0.00</h2>

            </div>

            <div class="card stat-card">

                <h3>Workers</h3>

                <h2 id="worker-count">0</h2>

            </div>

            <div class="card stat-card">

                <h3>Running Missions</h3>

                <h2 id="mission-count">0</h2>

            </div>

            <div class="card stat-card">

                <h3>Success Rate</h3>

                <h2 id="success-rate">100%</h2>

            </div>

        </section>

        <section class="dashboard-grid">

            <div class="card">

                <h2>AI Workforce</h2>

                <div id="workers">

                    Loading...

                </div>

            </div>

            <div class="card">

                <h2>Active Mission</h2>

                <div id="active-mission">

                    No active mission.

                </div>

                <button id="run-affiliate">

                    ▶ Launch Affiliate Discovery

                </button>

            </div>

            <div class="card">

                <h2>Latest Results</h2>

                <div id="latest-results">

                    No results yet.

                </div>

            </div>

            <div class="card">

                <h2>Live Events</h2>

                <div id="events">

                    Waiting...

                </div>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
